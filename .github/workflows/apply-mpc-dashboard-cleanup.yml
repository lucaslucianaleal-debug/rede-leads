name: Apply MPC dashboard cleanup

on:
  push:
    branches:
      - fix/mpc-dashboard-cleanup
    paths:
      - scripts/apply_mpc_dashboard_cleanup.py
      - .github/workflows/apply-mpc-dashboard-cleanup.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mpc-dashboard-cleanup
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply cleanup patch
        run: python scripts/apply_mpc_dashboard_cleanup.py

      - name: Validate diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit generated cleanup
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/crm/commandcenter/CampaignCard.tsx
          git commit -m "fix: limpa painel MPC e transforma segunda em plano diario [skip ci]"
          git push origin HEAD:fix/mpc-dashboard-cleanup
