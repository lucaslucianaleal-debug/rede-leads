<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative shapes -->
  <circle cx="1000" cy="100" r="150" fill="rgba(255,255,255,0.1)"/>
  <circle cx="200" cy="550" r="120" fill="rgba(255,255,255,0.08)"/>
  
  <!-- Main Title -->
  <text x="600" y="120" font-size="72" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial, sans-serif">
    Rede Leads
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="180" font-size="36" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif">
    Sistema de Gerenciamento de Leads
  </text>
  
  <!-- Service Cards -->
  <!-- Promotora Card -->
  <rect x="80" y="280" width="300" height="280" rx="16" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="230" y="330" font-size="64" text-anchor="middle">📱</text>
  <text x="230" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial, sans-serif">Promotora</text>
  <text x="230" y="450" font-size="18" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif">Captura de</text>
  <text x="230" y="480" font-size="18" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif">Contatos</text>
  
  <!-- Visita Comercial Card -->
  <rect x="450" y="280" width="300" height="280" rx="16" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="600" y="330" font-size="64" text-anchor="middle">💼</text>
  <text x="600" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial, sans-serif">Visita</text>
  <text x="600" y="420" font-size="28" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial, sans-serif">Comercial</text>
  <text x="600" y="480" font-size="18" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif">Prospecção</text>
  
  <!-- Sorteio Cupons Card -->
  <rect x="820" y="280" width="300" height="280" rx="16" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="970" y="330" font-size="64" text-anchor="middle">🏆</text>
  <text x="970" y="380" font-size="28" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial, sans-serif">Sorteio</text>
  <text x="970" y="420" font-size="28" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial, sans-serif">Cupons</text>
  <text x="970" y="480" font-size="18" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif">Premiação</text>
  
  <!-- Bottom tagline -->
  <text x="600" y="600" font-size="20" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif">
    Integração • Agendamento • Gestão em Tempo Real
  </text>
</svg>